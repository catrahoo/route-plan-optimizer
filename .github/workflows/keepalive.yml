name: supabase-keepalive
# Ping harian ke Supabase supaya project gratis tidak di-pause (batas 7 hari tidak aktif).
# Memanggil fungsi database (RPC), bukan sekadar baca tabel, supaya tercatat sebagai aktivitas database.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query ringan ke Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets SUPABASE_URL / SUPABASE_KEY belum diisi"; exit 1; fi
          curl -sf "${URL%/}/rest/v1/outlet_master?select=customerno&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          curl -sf -X POST "${URL%/}/rest/v1/rpc/get_outlets" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"codes":["3000046093"]}' > /dev/null && echo "OK"
