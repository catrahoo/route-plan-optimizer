name: import-neon-sekali
# Workflow sementara: kirim data outlet (terenkripsi) ke tabel staging Neon. Akan dihapus setelah dipakai.
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install "psycopg[binary]>=3.2"
      - name: Kirim blob terenkripsi ke staging
        env:
          DB: "postgresql://loader_tmp:z1SgZ9MFjCnG2mkTD9qXFPxXQNBu_wZx@ep-misty-bonus-azxwsbj0-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require"
        run: |
          python - <<'PY'
          import os, psycopg
          data = open("tmp_import/data.gpg", "rb").read()
          with psycopg.connect(os.environ["DB"]) as c:
              c.execute("insert into public.staging_blob (data) values (%s)", (data,))
          print("terkirim", len(data), "byte")
          PY
